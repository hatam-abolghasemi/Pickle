# Required: root directory in the repo, e.g. stg.
cluster: ""
# Marker in front of every commit subject, to tell clusters apart at a glance:
# red, orange, yellow, green, blue, purple, brown, black or white. Empty for none.
color: ""

git:
  # Required: git@host:path.git, ssh://... or https://... (never with credentials in it).
  url: ""
  branch: main
  # Use your own Secret (keys: ssh-privatekey + known_hosts, or token).
  # When set, the credentials below are ignored.
  existingSecret: ""
  sshPrivateKey: ""
  # Required with sshPrivateKey: output of `ssh-keyscan <git host>`.
  knownHosts: ""
  # For https:// URLs.
  token: ""
  sshUser: git
  httpsUsername: pickle
  authorName: pickle
  # Defaults to pickle@<cluster>.local.
  authorEmail: ""
  # Replace the local clone with a fresh shallow one after this many commits.
  compactEvery: 256

secrets:
  # Key for Secret value fingerprints, at least 32 characters (openssl rand -hex 32).
  # When set, each value is written as ****:<fingerprint>, so a changed value
  # shows up as a diff line under its key. Empty writes plain ****.
  # With git.existingSecret, put it in that Secret as fingerprint-key instead.
  # Keep it stable: a new key changes every fingerprint once.
  fingerprintKey: ""

config:
  # Commit once changes have been quiet this long...
  commitDelay: 10s
  # ...but never later than this after the first pending change.
  commitMaxDelay: 1m
  # New types are picked up from CRD/APIService events. Set e.g. 30m to also
  # rediscover on a timer; "off" disables the timer.
  rediscoveryInterval: "off"
  # Types never mirrored, on top of the built-in runtime noise:
  # Kind (any group), Kind.group or plural.group, or *.group for a whole group.
  # Files mirrored before an exclusion are removed on the next start.
  exclude: []
  # - IPAMBlock
  # - "*.crd.projectcalico.org"
  # Namespaces never mirrored (shell patterns like tmp-*), including their Namespace object.
  excludeNamespaces: []
  # Types watched as metadata only (group/resource, "core" for the core group):
  # objects with an owner are skipped without reading their spec and status,
  # the rest are read whole. Empty list: every type is read whole.
  metadataWatch:
    - core/pods
    - apps/replicasets
    - batch/jobs
  pageSize: 50
  pagePause: 200ms
  qps: 5
  burst: 10
  # debug, info, warn or error.
  logLevel: info

# Extra environment variables for the container.
extraEnv: []

image:
  repository: ghcr.io/hatam-abolghasemi/pickle
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

service:
  enabled: true
  port: 9090

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
podLabels: {}

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Size limit of the emptyDir holding the local clone.
dataSizeLimit: 2Gi

# Restrict pickle's traffic to the API server, your Git host and DNS.
networkPolicy:
  enabled: false
  # Required when enabled: API server endpoint IPs (not the kubernetes Service IP).
  apiServer:
    cidrs: []
    port: 6443
  # Required when enabled: where your Git host lives.
  git:
    cidrs: []
    ports: [22, 443]
  # Who may scrape :9090; empty allows any pod.
  metricsFrom: []

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
