{{- if not .Values.git.existingSecret }}
{{- if and (not .Values.git.token) (not .Values.git.sshPrivateKey) }}
{{- fail "set git.existingSecret, or git.sshPrivateKey + git.knownHosts, or git.token" }}
{{- end }}
{{- if and .Values.git.sshPrivateKey (not .Values.git.knownHosts) }}
{{- fail "git.knownHosts is required with git.sshPrivateKey (output of ssh-keyscan <git host>)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pickle.gitSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pickle.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.git.sshPrivateKey }}
  ssh-privatekey: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.git.knownHosts }}
  known_hosts: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.git.token }}
  token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.fingerprintKey }}
  fingerprint-key: {{ . | quote }}
  {{- end }}
{{- end }}
