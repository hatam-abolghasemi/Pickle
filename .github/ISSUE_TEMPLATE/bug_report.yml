name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Relevant lines from `kubectl -n pickle logs deploy/pickle`.
      render: text
  - type: input
    attributes:
      label: Versions
      placeholder: pickle X.Y.Z, Kubernetes X.Y, Helm X.Y
    validations:
      required: true
