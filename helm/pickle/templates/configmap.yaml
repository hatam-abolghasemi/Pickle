apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pickle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pickle.labels" . | nindent 4 }}
data:
  PICKLE_CLUSTER: {{ required "cluster is required (root directory in the repo, e.g. stg)" .Values.cluster | quote }}
  {{- with .Values.color }}
  PICKLE_COLOR: {{ . | quote }}
  {{- end }}
  PICKLE_GIT_URL: {{ required "git.url is required" .Values.git.url | quote }}
  PICKLE_GIT_BRANCH: {{ .Values.git.branch | quote }}
  PICKLE_GIT_SSH_USER: {{ .Values.git.sshUser | quote }}
  PICKLE_GIT_USERNAME: {{ .Values.git.httpsUsername | quote }}
  PICKLE_GIT_AUTHOR_NAME: {{ .Values.git.authorName | quote }}
  {{- with .Values.git.authorEmail }}
  PICKLE_GIT_AUTHOR_EMAIL: {{ . | quote }}
  {{- end }}
  PICKLE_GIT_COMPACT_EVERY: {{ .Values.git.compactEvery | quote }}
  PICKLE_COMMIT_DELAY: {{ .Values.config.commitDelay | quote }}
  PICKLE_COMMIT_MAX_DELAY: {{ .Values.config.commitMaxDelay | quote }}
  PICKLE_REDISCOVERY_INTERVAL: {{ .Values.config.rediscoveryInterval | quote }}
  PICKLE_EXCLUDE: {{ join "," .Values.config.exclude | quote }}
  PICKLE_EXCLUDE_NAMESPACES: {{ join "," .Values.config.excludeNamespaces | quote }}
  PICKLE_METADATA_WATCH: {{ join "," .Values.config.metadataWatch | quote }}
  PICKLE_PAGE_SIZE: {{ .Values.config.pageSize | quote }}
  PICKLE_PAGE_PAUSE: {{ .Values.config.pagePause | quote }}
  PICKLE_QPS: {{ .Values.config.qps | quote }}
  PICKLE_BURST: {{ .Values.config.burst | quote }}
  PICKLE_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PICKLE_METRICS_ADDR: {{ printf ":%v" .Values.service.port | quote }}
