apiVersion: v1
kind: ConfigMap
metadata:
  name: pickle
  namespace: pickle
data:
  PICKLE_CLUSTER: stg
  PICKLE_GIT_URL: "git@gitlab.example.com:devops/cluster-state.git"
  PICKLE_GIT_BRANCH: main
  PICKLE_GIT_COMPACT_EVERY: "256"
  PICKLE_COMMIT_DELAY: 10s
  PICKLE_COMMIT_MAX_DELAY: 1m
  PICKLE_REDISCOVERY_INTERVAL: "off"
  PICKLE_EXCLUDE: "IPAMBlock"
  PICKLE_EXCLUDE_NAMESPACES: ""
  PICKLE_PAGE_SIZE: "50"
  PICKLE_PAGE_PAUSE: 200ms
  PICKLE_QPS: "5"
  PICKLE_BURST: "10"
  PICKLE_LOG_LEVEL: info
