version: 2
updates:
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      go-git:
        patterns: ["github.com/go-git/*"]
      golang-x:
        patterns: ["golang.org/x/*"]
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
